version: '3'

tasks:
  setup:
    desc: Install project dependencies.
    cmds:
      - uv sync --extra dev

  test:
    desc: Run tests.
    cmds:
      - uv run pytest

  lint:
    desc: Run lint checks.
    cmds:
      - uv run ruff check .

  format:
    desc: Format code.
    cmds:
      - uv run ruff format .

  format-check:
    desc: Check code formatting.
    cmds:
      - uv run ruff format --check .

  typecheck:
    desc: Run type checks.
    cmds:
      - uv run pyright

  hooks:
    desc: Run pre-commit hooks against all files.
    cmds:
      - uv run pre-commit run --all-files

  install-hooks:
    desc: Install pre-commit and commit-msg hooks.
    cmds:
      - uv run pre-commit install
      - uv run pre-commit install --hook-type commit-msg

  target:
    desc: Start the local vulnerable FastAPI target on port 9000.
    cmds:
      - uv run quarry target start examples/vulnerable-fastapi --port 9000

  worker:
    desc: Start the Quarry worker.
    cmds:
      - uv run quarry worker

  tui:
    desc: Start the Quarry TUI.
    cmds:
      - uv run quarry tui

  report:
    desc: Show report commands.
    cmds:
      - uv run quarry report --help

  prompt-lint:
    desc: Check that no prompt text lives in Python source files (ADR-019).
    cmds:
      - uv run python scripts/prompt_lint.py src

  hadolint:
    desc: Lint the Dockerfile with hadolint (via docker).
    cmds:
      - docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" hadolint/hadolint hadolint --config /.hadolint.yaml - < Dockerfile

  docker-build:
    desc: Build the Quarry server/worker image.
    cmds:
      - docker build -t quarry:local .

  compose-up:
    desc: Start Temporal + server + worker via docker compose.
    cmds:
      - docker compose up --build -d

  compose-down:
    desc: Stop the docker compose stack.
    cmds:
      - docker compose down

  demo:
    desc: Run the local demo scan (checks prerequisites first).
    cmds:
      - bash scripts/demo.sh

  benchmark-local:
    desc: |
      Run the local vulnerable-app benchmark.
      Pass DYNAMIC=1 to enable live dynamic validation (requires target on port 9000).
      Pass TARGET_HOST to override the host used to reach the target from inside Docker
      (default: host.docker.internal; Colima users: host.lima.internal; Linux: 172.17.0.1).
    vars:
      DYNAMIC: '{{.DYNAMIC | default ""}}'
      TARGET_HOST: '{{.TARGET_HOST | default "host.docker.internal"}}'
    cmds:
      - |
        if [ -n "{{.DYNAMIC}}" ]; then
          uv run quarry benchmark local --target http://{{.TARGET_HOST}}:9000 --dynamic-validation --live-prove
        else
          uv run quarry benchmark local
        fi
