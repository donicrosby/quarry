# Quarry local stack: Temporal (dev) + API server + worker.
#
#   cp quarry.toml.example quarry.toml   # user-local config (gitignored) — required
#   docker compose up --build
#
# The server runs with --no-worker so the dedicated worker container owns the
# `quarry-control` task queue (running both would double-poll the queue).
# Secrets/config (CHUTES_API_KEY, QUARRY_PANEL, GITHUB_TOKEN, GIT_CLONE_TOKEN)
# are passed through from your shell / .env — see .env.example.

services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --port 7233 --ui-port 8233 --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      # Version pins default in the Dockerfile; override here if needed, e.g.
      # args:
      #   UV_VERSION: 0.9.21
    image: quarry:local
    command: ["quarry", "server", "--no-worker"]
    environment:
      QUARRY_TEMPORAL_ADDRESS: temporal:7233
      QUARRY_SERVER_HOST: 0.0.0.0
      QUARRY_SERVER_PORT: "8000"
      QUARRY_DB_PATH: /data/quarry.db
      QUARRY_PANEL: ${QUARRY_PANEL:-}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
    ports:
      # Host side remappable for hosts where 8000 is taken:
      #   QUARRY_SERVER_HOST_PORT=8001 docker compose up -d
      - "${QUARRY_SERVER_HOST_PORT:-8000}:8000"
    volumes:
      - quarry-data:/data
      # User-local config (gitignored; cp quarry.toml.example quarry.toml first).
      # create_host_path: false fails fast if the file is missing — without it
      # Docker silently creates an empty DIRECTORY here and every scan 500s
      # when the config loader read()s it (IsADirectoryError).
      - type: bind
        source: ./quarry.toml
        target: /app/quarry.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Recording MITM proxy (traffic-capture-verified-evidence). Every agent HTTP
  # request from the worker transits this sidecar, which writes the full exchange
  # into the shared content-addressed capture store and indexes it for query.
  #
  # HARDENING: no `ports:` entry. The proxy is reachable only on the compose
  # network; publishing :8788 to the host would expose an intercepting proxy.
  proxy:
    image: mitmproxy/mitmproxy:12.3.1
    # Runs as root: the recording addon must mkdir() inside the fresh
    # root-owned traffic-capture volume, and the mitmproxy image defaults to
    # uid 1000 (PermissionError at startup). Acceptable for a localhost-only
    # dev stack; if this ever leaves localhost, switch to a chown-init
    # container pattern instead.
    user: "0:0"
    command:
      # Program name required: the image entrypoint execs "$@" verbatim, so a
      # bare flags list dies with `exec: --: invalid option` at startup.
      - "mitmdump"
      - "--listen-host"
      - "0.0.0.0"
      - "--listen-port"
      - "8788"
      - "--set"
      - "confdir=/home/mitmproxy/.mitmproxy"
      - "-s"
      - "/app/src/quarry_traffic/addon.py"
    environment:
      QUARRY_TRAFFIC_CAPTURE_ROOT: /data/traffic-capture
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
      - traffic-capture:/data/traffic-capture
      - proxy-certs:/home/mitmproxy/.mitmproxy
    healthcheck:
      # The CA is generated on first start; the worker waits for it so its TLS
      # trust store is populated before any proxied HTTPS request.
      test: ["CMD-SHELL", "test -f /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    # Same image as the server; built once by the server service.
    image: quarry:local
    # Build a combined CA bundle at start (system roots + the recording proxy's
    # interception CA), then exec the worker. SSL_CERT_FILE / REQUESTS_CA_BUNDLE
    # REPLACE the trust store rather than extend it — httpx does
    # `ssl.create_default_context(cafile=SSL_CERT_FILE)`, which loads ONLY that
    # file — so pointing them at the mitmproxy-CA-only PEM would break TLS to
    # every NO_PROXY'd provider (api.openai.com, api.anthropic.com, openrouter.ai,
    # …), the exact direct egress the NO_PROXY funnel protects. Concatenating
    # keeps both MITM'd proxied hosts and direct provider hosts verifiable.
    command:
      - sh
      - -c
      - |
        cat /etc/ssl/certs/ca-certificates.crt /mitmproxy-certs/mitmproxy-ca-cert.pem > /tmp/quarry-ca-bundle.pem
        exec quarry worker
    # Memory cap for the worker container.  The browser-capable (quarry:dynamic)
    mem_limit: 2g
    environment:
      QUARRY_TEMPORAL_ADDRESS: temporal:7233
      QUARRY_DB_PATH: /data/quarry.db
      # Container memory cap applied to each Tier-2 sandbox container the worker
      # spawns (Docker --memory value); browser-capable sandboxes run on the
      # per-policy restricted egress network and are capped here as well.
      QUARRY_SANDBOX_MEMORY: ${QUARRY_SANDBOX_MEMORY:-2g}
      # Optional model/scan config + git auth — passed through from the host/.env.
      QUARRY_PANEL: ${QUARRY_PANEL:-}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_CLONE_TOKEN: ${GIT_CLONE_TOKEN:-}
      # Recording-proxy funnel: agent HTTP transits the recording sidecar;
      # infrastructure egress (model providers, Temporal, auth) bypasses it.
      HTTP_PROXY: ${QUARRY_HTTP_PROXY:-http://proxy:8788}
      HTTPS_PROXY: ${QUARRY_HTTPS_PROXY:-http://proxy:8788}
      NO_PROXY: ${QUARRY_NO_PROXY:-localhost,127.0.0.1,::1,temporal,server,host.docker.internal,api.openai.com,api.anthropic.com,openrouter.ai,api.chutes.ai,generativelanguage.googleapis.com}
      # Trust the proxy's interception CA for proxied HTTPS. Points at the
      # combined system+proxy bundle the command above builds (NOT the
      # mitmproxy-CA-only PEM, which would replace the whole trust store).
      SSL_CERT_FILE: /tmp/quarry-ca-bundle.pem
      REQUESTS_CA_BUNDLE: /tmp/quarry-ca-bundle.pem
      QUARRY_TRAFFIC_CAPTURE_ROOT: /data/traffic-capture
      QUARRY_EVIDENCE_STORE_ROOT: /data/evidence
    volumes:
      - quarry-data:/data
      - ./examples:/app/examples:ro
      - traffic-capture:/data/traffic-capture
      - evidence-store:/data/evidence
      - proxy-certs:/mitmproxy-certs:ro
    depends_on:
      temporal:
        condition: service_healthy
      proxy:
        condition: service_healthy

volumes:
  # Shared SQLite DB + scan artifacts. Dev-grade: two containers share one SQLite
  # file and rely on its locking. Postgres is the future path for concurrency.
  quarry-data:
  # Shared with the proxy sidecar: the disposable full-capture store.
  traffic-capture:
  # The durable, hash-verified evidence store (never reclaimed with capture).
  evidence-store:
  # mitmproxy's generated CA, shared read-only into the worker's trust store.
  proxy-certs:
