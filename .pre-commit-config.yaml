default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pinned-refs
        name: pinned action + pre-commit refs (supply-chain)
        entry: uv run python scripts/check_pinned_refs.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/AleksaC/hadolint-py
    rev: e70baeefd566058716df2f29eae8fe8ffc213a9f # v2.12.1b3
    hooks:
      - id: hadolint
        name: hadolint (Dockerfile lint)
        args: ["--config", ".hadolint.yaml"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
