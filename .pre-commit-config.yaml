default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pinned-refs
        name: pinned action + pre-commit refs (supply-chain)
        entry: uv run python scripts/check_pinned_refs.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb # v2.15.1b3
    hooks:
      - id: hadolint
        name: hadolint (Dockerfile lint)
        args: ["--config", ".hadolint.yaml"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
