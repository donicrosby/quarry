services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --port 7233 --ui-port 8233 --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:7233"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
