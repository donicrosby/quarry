name: Release

# Cut a release by pushing a semver tag from a green `main`:
#   git tag v1.2.3 && git push origin v1.2.3
# This builds + publishes version-tagged server/worker images, signs them with
# cosign (keyless / Sigstore), generates an SBOM from the locked dependency
# tree, and creates the GitHub Release with auto-generated notes plus the signed
# SBOM. (CI already gates main, so releases are cut from validated history; the
# image build + signing here is the final guard.)
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.21"
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: publish signed images + GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push images to GHCR
      id-token: write # Sigstore keyless signing (workflow OIDC identity)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so release notes can diff from the last tag
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Derive image tags from the git tag: v1.2.3 -> 1.2.3, 1.2, 1 (+ latest for
      # non-prerelease, via the default latest=auto flavor), for both images.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.name }}/quarry-server
            ghcr.io/${{ steps.owner.outputs.name }}/quarry-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push version-tagged images
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ---- Supply-chain integrity: sign + SBOM, all BEFORE the Release. ----
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # Keyless signing via the job's Sigstore OIDC identity. Signing by image
      # digest (immutable) means the signature cannot be re-pointed at a
      # different image later. If signing fails the job stops here and the
      # GitHub Release below is never created — an unsigned release is not
      # publishable.
      - name: Sign container images (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "${DIGEST}" || { echo "build step produced no image digest" >&2; exit 1; }
          for img in quarry-server quarry-worker; do
            cosign sign --yes "ghcr.io/${{ steps.owner.outputs.name }}/${img}@${DIGEST}"
          done
      # SBOM straight from uv.lock (CycloneDX 1.5) — the full locked Python
      # dependency tree, generated by uv itself (no third-party action in the
      # loop).
      - name: Generate SBOM (CycloneDX) from locked dependency tree
        run: |
          uv export --frozen --no-emit-project --format cyclonedx1.5 \
            -o "quarry-${GITHUB_REF_NAME}.cdx.json"
      - name: Sign SBOM (cosign, keyless)
        run: |
          cosign sign-blob --yes "quarry-${GITHUB_REF_NAME}.cdx.json" \
            --bundle "quarry-${GITHUB_REF_NAME}.cdx.json.sigstore.json"
      # Only after the images are signed and the SBOM is generated + signed:
      # create the GitHub Release, attaching the SBOM and its Sigstore bundle.
      # Verification instructions: docs/release-verification.md.
      - name: Create GitHub release (with signed SBOM)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes \
            "quarry-${GITHUB_REF_NAME}.cdx.json" \
            "quarry-${GITHUB_REF_NAME}.cdx.json.sigstore.json"
