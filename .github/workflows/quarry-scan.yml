name: Quarry Scan

# Reusable workflow (`workflow_call`): scan the calling repository with Quarry,
# publish the SARIF log to GitHub code scanning, and fail the check when proven
# findings at or above `severity_threshold` remain.
#
# Exit-code contract (generic CI; the GitLab component mirrors it):
#   0 — no proven findings at or above the threshold
#   1 — findings at or above the threshold
#   2 — scan error (Quarry did not complete)
on:
  workflow_call:
    inputs:
      quarry_config:
        description: "Path to the Quarry config file (quarry.toml), relative to the target repo."
        required: true
        type: string
      target_repo:
        description: "Path of the repository to scan."
        required: false
        type: string
        default: ${{ github.workspace }}
      severity_threshold:
        description: "Minimum Quarry severity that fails the check: info|low|medium|high|critical."
        required: false
        type: string
        default: low
      quarry_version:
        description: "Quarry git ref to check out and install."
        required: false
        type: string
        default: latest
    secrets:
      quarry_model_api_key:
        description: "Optional model-panel API key; exported to the scan as CHUTES_API_KEY."
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  quarry-scan:
    name: Quarry scan
    runs-on: ubuntu-latest
    env:
      QUARRY_CONFIG_FILE: ${{ inputs.quarry_config }}
      SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
      QUARRY_TARGET_REPO: ${{ inputs.target_repo }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout Quarry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: donicrosby/quarry
          ref: ${{ inputs.quarry_version }}
          path: quarry-tool
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Quarry
        # Quarry is not published to PyPI (`pip install quarry` resolves an
        # unrelated package), so install from the checked-out source.
        run: python -m pip install ./quarry-tool
      - name: Start Temporal
        run: docker compose -f quarry-tool/docker-compose.yml up -d temporal
      - name: Start Quarry server
        working-directory: ${{ inputs.target_repo }}
        env:
          CHUTES_API_KEY: ${{ secrets.quarry_model_api_key }}
        run: |
          nohup quarry server > "${{ runner.temp }}/quarry-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Quarry server did not become healthy"
          cat "${{ runner.temp }}/quarry-server.log" || true
          exit 2
      - name: Run Quarry scan
        working-directory: ${{ inputs.target_repo }}
        env:
          CHUTES_API_KEY: ${{ secrets.quarry_model_api_key }}
        run: |
          set +e
          quarry scan run --repo "$QUARRY_TARGET_REPO"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Quarry scan failed (exit $rc)"
            exit 2   # exit-code contract: 2 = scan error
          fi
      - name: Filter SARIF to the severity threshold
        run: |
          shopt -s nullglob
          mkdir -p sarif
          logs=("$QUARRY_TARGET_REPO"/.quarry/artifacts/sarif/*.sarif.json)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "::error::the Quarry scan produced no SARIF log"
            exit 2
          fi
          for log in "${logs[@]}"; do
            jq --arg threshold "$SEVERITY_THRESHOLD" \
              -f quarry-tool/ci/sarif_severity_filter.jq \
              "$log" > "sarif/$(basename "$log")"
          done
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          # upload-sarif takes a file or a directory, never a glob: the
          # directory upload merges every SARIF file within it, and `category`
          # namespaces the results so a re-run replaces instead of duplicating.
          sarif_file: sarif/
          category: quarry
      - name: Fail on findings at or above threshold
        run: |
          shopt -s nullglob
          total=0
          for log in sarif/*.sarif.json; do
            count=$(jq '[.runs[0].results[]] | length' "$log")
            total=$((total + count))
          done
          echo "findings at or above '${SEVERITY_THRESHOLD}': ${total}"
          if [ "$total" -gt 0 ]; then
            echo "::error::${total} proven finding(s) at or above severity '${SEVERITY_THRESHOLD}'"
            exit 1
          fi
