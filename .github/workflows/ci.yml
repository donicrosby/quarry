name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.21"
  PYTHON_VERSION: "3.12"

jobs:
  # Fast static checks share a single dependency install (no N× syncs).
  static:
    name: lint / format / types / lockfile / prompts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: uv sync --group dev --frozen
      - name: uv lockfile is in sync
        run: uv lock --check
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: prompt-lint (ADR-019)
        run: uv run python scripts/prompt_lint.py src
      - name: pyright (strict)
        run: uv run pyright

  # Unit + golden suite, split across 4 free 4-core runners by pytest-shard
  # (deterministic hash split, no stored durations state to rot). Same
  # --dist loadfile per shard: file-affinity for sandbox-fork tests is preserved
  # WITHIN each shard; shards never share a process. On a public repo standard
  # runners are free and unlimited, so this buys wall-clock with machine count,
  # not paid larger runners.
  test-unit:
    name: tests (unit/golden, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # ripgrep backs the `grep` tool; installing it lets the grep tool tests run
      # for real instead of skipping (the only binary any test is gated on).
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: uv sync --group dev --frozen
      # Self-contained: conftest spins up an in-process Temporal test env
      # (start_time_skipping), so no external services are needed. pytest config
      # already sets -n auto + 300s per-test timeout + ResourceWarning-as-error.
      # --dist loadfile keeps each test file on a single xdist worker so the
      # sandbox-fork tests are not interleaved into the Temporal-heavy files
      # wherever -n auto happens to schedule them. GitHub runners cap
      # RLIMIT_NPROC at 64 per real UID (threads count) and two workers each
      # running a Java Temporal test server peak right at that limit, so any
      # fork-heavy test scheduled there dies with EAGAIN ("Cannot fork").
      # --durations=25 prints the shard's slowest tests every run: free
      # rebalancing/kill-list evidence, zero behavioral cost.
      - name: pytest (unit/golden shard)
        run: >
          uv run pytest tests/unit tests/golden --dist loadfile
          --shard-id ${{ matrix.shard }} --num-shards 4 --durations=25

  # Integration suite: still serial (-n 0) — these ARE the fork-pressure tests
  # (subprocess git/sandbox exec + Java Temporal servers vs the runner's
  # RLIMIT_NPROC=64) — but the serial tail is halved across two runners by
  # pytest-shard instead of parallelized inside one.
  test-integration:
    name: tests (integration, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: uv sync --group dev --frozen
      - name: pytest (integration shard)
        run: >
          uv run pytest tests/integration -n 0
          --shard-id ${{ matrix.shard }} --num-shards 2 --durations=25

  test-browser:
    name: tests (browser extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      # Install the browser extra so the playwright codepath in
      # browser_login.py is exercised (the default `tests` job runs without it,
      # covering only the playwright-absent branch). Chromium is not installed
      # — these are unit tests that stub the browser or assert actionable
      # unavailability, not live browser automation.
      - run: uv sync --group dev --extra browser --frozen
      - name: pytest (browser login resolver)
        run: uv run pytest tests/unit/test_browser_login_resolver.py -v

  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  docker:
    name: docker build${{ github.event_name == 'push' && ' + push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image refs
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            for img in quarry-server quarry-worker; do
              echo "ghcr.io/${owner}/${img}:latest"
              echo "ghcr.io/${owner}/${img}:sha-${short}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One build, tagged as both server and worker (identical image, different
      # run command). PRs build-only (proves it compiles + warms the cache);
      # pushes to main publish to GHCR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
