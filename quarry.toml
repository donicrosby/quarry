# quarry.toml — Chutes multi-model panel
# Drives the agentic pipeline (recon → hunt → validate → gapfill → dedup)
# through LiteLLM's native Chutes support: model = "chutes/<model-id>".
#
# Required env var (never put in this file — the parser rejects *_KEY keys):
#   export CHUTES_API_KEY=<your-key>
#   export QUARRY_PANEL=chutes
#
# Model IDs: verify against your Chutes account before running.
# LiteLLM passes everything after "chutes/" verbatim to the Chutes endpoint.

# --------------------------------------------------------------------------
# Keep the proof run cheap: 4 iterations per agent, 2 hunters in parallel.
# --------------------------------------------------------------------------
[scan_defaults]
hunt_max_iterations = 4
hunt_max_concurrent = 2

# --------------------------------------------------------------------------
# Chutes panel — different model family per role for cross-vendor disagreement.
# recon  : DeepSeek-V3.2  (reliable structured JSON output for architecture analysis)
# hunt   : Qwen3-32B  (different vendor family from DeepSeek)
# validate: Kimi-K2.6  (moonshotai family → cross_vendor_disagreement vs Qwen)
# gapfill : DeepSeek-V3.2  (Qwen3-235B-Thinking gave ChutesException; back to DeepSeek)
# dedup reuses the gapfill role config (same toolset, no separate entry needed)
# --------------------------------------------------------------------------

[panels.chutes.roles.recon]
provider = "litellm"
model    = "chutes/deepseek-ai/DeepSeek-V3.2-TEE"
rpm      = 30

[panels.chutes.roles.hunt]
provider = "litellm"
model    = "chutes/Qwen/Qwen3-32B-TEE"
rpm      = 20

[panels.chutes.roles.validate]
provider = "litellm"
model    = "chutes/moonshotai/Kimi-K2.6-TEE"
rpm      = 20

[panels.chutes.roles.gapfill]
provider = "litellm"
model    = "chutes/deepseek-ai/DeepSeek-V3.2-TEE"
rpm      = 20

[panels.chutes.roles.prove]
provider = "litellm"
model    = "chutes/moonshotai/Kimi-K2.6-TEE"
rpm      = 20

[panels.chutes.roles.trace]
provider = "litellm"
model    = "chutes/deepseek-ai/DeepSeek-V3.2-TEE"
rpm      = 20
