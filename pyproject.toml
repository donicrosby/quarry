[build-system]
requires = ["uv_build>=0.11.17,<0.12"]
build-backend = "uv_build"

[project]
name = "quarry"
version = "0.1.0"
description = "Local-first agentic vulnerability research harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "botocore>=1.43.26",
  "protobuf>=5.0.0",
  "fastapi>=0.115.13",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "litellm>=1.86.2",
  "pydantic>=2.11.5",
  "pydantic-settings>=2.14.1",
  "sqlalchemy>=2.0.41",
  "sse-starlette>=3.4.4",
  "temporalio>=1.11.1",
  "textual>=3.2.0",
  "tree-sitter>=0.24.0",
  "tree-sitter-c>=0.24.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "typer>=0.16.0",
  "uvicorn>=0.34.3",
]

[project.optional-dependencies]
# Browser-based login for authenticated live exploitation (ADR-023). Heavy
# (bundled Chromium, hundreds of MB); opt-in only. Non-browser scans must never
# require it — the browser_login path imports Playwright lazily and errors
# actionably when this extra is not installed.
browser = ["playwright>=1.49.0"]

[dependency-groups]                                                                                                            
  dev = [
  "pre-commit>=4.5.0",
  "pyright>=1.1.401",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-shard>=0.1.2",
  "pytest-timeout>=2.3.1",
  "pytest-xdist>=3.6.0",
  "ruff>=0.11.12",
]

[project.scripts]
quarry = "quarry_cli.main:app"

[project.entry-points."quarry.plugins"]
opengrep = "quarry_tools.opengrep:OPENGREP_TOOL"
treesitter_query = "quarry_tools.treesitter:TREESITTER_TOOL"
file = "quarry_integrations.sinks.file_sink:FILE_SINK"
jira_dry_run = "quarry_integrations.sinks.jira_dry_run:JIRA_DRY_RUN_SINK"
slack_dry_run = "quarry_integrations.sinks.slack_dry_run:SLACK_DRY_RUN_SINK"
slack_notify = "quarry_plugins.hooks.slack_notify:SLACK_NOTIFY_HOOK"
multitenant_isolation = "quarry_plugins.context.multitenant_isolation:MULTITENANT_ISOLATION_PLUGIN"
template_injection = "quarry_plugins.context.template_injection:TEMPLATE_INJECTION_PLUGIN"
kb_context = "quarry_plugins.context.kb_context:KB_CONTEXT_PLUGIN"

[tool.uv.build-backend]
module-name = [
  "quarry",
  "quarry_activities",
  "quarry_artifacts",
  "quarry_cli",
  "quarry_integrations",
  "quarry_models",
  "quarry_persistence",
  "quarry_plugins",
  "quarry_prompts",
  "quarry_tools",
  "quarry_tui",
  "quarry_worker",
  "quarry_workflows",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# examples/ are intentional vulnerability fixtures (scan targets) — never lint or
# reformat them (it would alter seeded code and shift golden line numbers).
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query/Path/Depends in argument defaults is the framework's intended
# idiom, not the mutable-default-argument bug B008 guards against.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto"
timeout = 300
filterwarnings = [
    "error::ResourceWarning",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["**/__pycache__", "tests/fixtures"]
extraPaths = ["src", "scripts"]
venv = ".venv"
venvPath = "."
reportUnknownMemberType = "none"

