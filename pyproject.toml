[build-system]
requires = ["uv_build>=0.11.17,<0.12"]
build-backend = "uv_build"

[project]
name = "quarry"
version = "0.1.0"
description = "Local-first agentic vulnerability research harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.13",
  "jinja2>=3.1.6",
  "pydantic>=2.11.5",
  "sqlalchemy>=2.0.41",
  "temporalio>=1.11.1",
  "textual>=3.2.0",
  "typer>=0.16.0",
  "uvicorn>=0.34.3",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.5.0",
  "pyright>=1.1.401",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.12",
]

[project.scripts]
quarry = "quarry_cli.main:app"

[tool.uv.build-backend]
module-name = [
  "quarry",
  "quarry_activities",
  "quarry_artifacts",
  "quarry_cli",
  "quarry_persistence",
  "quarry_tui",
  "quarry_worker",
  "quarry_workflows",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
